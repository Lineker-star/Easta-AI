<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Log in — EASTA</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}"
    >
</head>

<body class="login-page">

    <div class="login-card">

        <div class="login-brand">
            <span class="brand-mark">E</span>

            <div>
                <h1>EASTA</h1>
                <p>Your AI assistant, built for Africa</p>
            </div>
        </div>

        <div class="login-heading">
            <h2>Welcome back</h2>
            <p>Log in to continue your conversations.</p>
        </div>

        <p
            id="login-error"
            class="error-message login-error"
        ></p>

        <form
            id="login-form"
            class="login-form"
        >

            <div class="login-field">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autofocus
                >
            </div>

            <div class="login-field">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                Log in
            </button>

        </form>

        <p class="login-switch">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create one</a>
        </p>

        <p class="login-switch" style="margin-top: 8px;">
            <a href="{{ url_for('landing') }}">&larr; Back to home</a>
        </p>

    </div>

    <script>
        window.BACKEND_URL = {{ backend_url | tojson }};
    </script>

    <script src="{{ url_for('static', filename='login.js') }}"></script>

</body>
</html>
