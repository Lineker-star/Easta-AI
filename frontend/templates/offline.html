<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>You're offline — EASTA</title>

    {% include "_theme_init.html" %}
    {% include "_pwa_head.html" %}

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}"
    >
</head>

<body class="login-page">

    <div class="login-card">

        <div class="login-brand">
            <span class="brand-mark">E</span>

            <div>
                <h1>EASTA</h1>
                <p>Your AI assistant, built for Africa</p>
            </div>
        </div>

        <div class="login-heading">
            <h2>You're offline</h2>
            <p>
                EASTA needs a connection to reach the AI backend. This
                page is served by the app's own offline fallback rather
                than a browser error — reconnect and try again.
            </p>
        </div>

        <button
            type="button"
            class="login-button"
            onclick="window.location.reload()"
        >
            Try again
        </button>

    </div>

    <script src="{{ url_for('static', filename='pwa.js') }}"></script>

</body>
</html>
