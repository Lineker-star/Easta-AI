<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Create account — EASTA</title>

    {% include "_theme_init.html" %}
    {% include "_pwa_head.html" %}
    {% include "_sentry_init.html" %}

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}"
    >
</head>

<body class="login-page">

    <div class="login-card">

        <div class="login-brand">
            <img
                class="brand-mark"
                src="{{ url_for('static', filename='icons/icon-square.png') }}"
                alt="EASTA"
            >

            <div>
                <h1>EASTA</h1>
                <p>Your AI assistant, built for Africa</p>
            </div>
        </div>

        <div class="login-heading">
            <h2>Create an account</h2>
            <p>Create your account to start chatting with EASTA.</p>
        </div>

        <p
            id="register-error"
            class="error-message login-error"
        ></p>

        <form
            id="register-form"
            class="login-form"
            data-next="{{ next_path or '' }}"
        >

            <div class="login-field">
                <label for="username">Username</label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Choose a username"
                    required
                    autofocus
                >
            </div>

            <div class="login-field">
                <label for="email">Email</label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="login-field">
                <label for="password">Password</label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="login-field">
                <label for="confirm-password">Confirm Password</label>

                <input
                    id="confirm-password"
                    name="confirm_password"
                    type="password"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                Create Account
            </button>

        </form>

        <div class="auth-divider" id="auth-divider" hidden>or</div>

        <a
            href="{{ google_login_url }}"
            class="google-signin-button"
            id="google-signin-button"
            hidden
        >
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/>
                <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/>
                <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
            </svg>
            Continue with Google
        </a>

        <p class="login-switch">
            Already have an account?
            <a href="{{ url_for('login_page', next=next_path) if next_path else url_for('login_page') }}">Log in</a>
        </p>

        <p class="login-switch">
            <a href="{{ url_for('landing') }}">&larr; Back to home</a>
        </p>

    </div>

    <script>
        window.BACKEND_URL = {{ backend_url | tojson }};
    </script>

    <script src="{{ url_for('static', filename='register.js') }}"></script>
    <script src="{{ url_for('static', filename='pwa.js') }}"></script>

</body>
</html>
